<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalp ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

svg {
    width: 90vw;
    height: 90vw;
    max-width: 600px;
    max-height: 600px;
}

#heart {
    fill: none;
    stroke: red;
    stroke-width: 0.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.text {
    position: absolute;
    bottom: 12%;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 24px;
    opacity: 0;
    animation: yazı 2s ease forwards;
    animation-delay: 5s;
}

@keyframes yazı {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<svg viewBox="-18 -18 36 36">
    <path id="heart"></path>
</svg>

<div class="text">❤️</div>

<script>
const heart = document.getElementById("heart");
let points = [];

const toplam = 1000;

for (let i = 0; i <= toplam; i++) {

    const t = (i / toplam) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    points.push(`${x / 20},${-y / 20}`);
}

heart.setAttribute("d", "M " + points.join(" L "));

const uzunluk = heart.getTotalLength();

heart.style.strokeDasharray = uzunluk;
heart.style.strokeDashoffset = uzunluk;

heart.animate(
    [
        { strokeDashoffset: uzunluk },
        { strokeDashoffset: 0 }
    ],
    {
        duration: 5000,
        easing: "linear",
        fill: "forwards"
    }
);
</script>

</body>
</html>
