<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalp ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Kalp */
.heart {
    position: relative;
    width: 180px;
    height: 180px;
    transform: rotate(-45deg);
    animation: kalp 1.5s ease-in-out infinite alternate;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    background: red;
    border-radius: 50%;
}

.heart {
    background: red;
}

.heart::before {
    top: -90px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 90px;
}

@keyframes kalp {
    from {
        transform: rotate(-45deg) scale(0.9);
    }

    to {
        transform: rotate(-45deg) scale(1.05);
    }
}

.yazi {
    position: absolute;
    bottom: 12%;

    color: white;
    font-size: 28px;
    font-family: Arial, sans-serif;

    animation: ortaya 2s ease forwards;
}

@keyframes ortaya {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="heart"></div>

<div class="yazi">
❤️
</div>

</body>
</html>
