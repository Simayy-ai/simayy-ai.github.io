<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalp</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.heart {
    width: 320px;
    height: 290px;
}

/* BÜTÜN ÇİZGİLER */
svg {
    width: 320px;
    height: 290px;
    overflow: visible;
}

path {
    fill: none;
    stroke: #ff1744;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* DIŞ KALP */
.outline {
    stroke-width: 2;
    stroke-dasharray: 1100;
    stroke-dashoffset: 1100;
    animation: draw 3s ease forwards;
}

/* MERİDYEN ÇİZGİLERİ */
.meridian {
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: drawMeridian 1.5s ease forwards;
}

/* Çizgiler sırayla oluşsun */
.m1  { animation-delay: 2.8s; }
.m2  { animation-delay: 2.95s; }
.m3  { animation-delay: 3.1s; }
.m4  { animation-delay: 3.25s; }
.m5  { animation-delay: 3.4s; }
.m6  { animation-delay: 3.55s; }
.m7  { animation-delay: 3.7s; }
.m8  { animation-delay: 3.85s; }
.m9  { animation-delay: 4s; }
.m10 { animation-delay: 4.15s; }

.m13 { animation-delay: 4.6s; }

.m15 { animation-delay: 4.9s; }
.m16 { animation-delay: 5.05s; }
.m17 { animation-delay: 5.2s; }
.m18 { animation-delay: 5.35s; }
.m19 { animation-delay: 5.5s; }
.m20 { animation-delay: 5.65s; }
.m21 { animation-delay: 5.8s; }
.m22 { animation-delay: 5.95s; }
.m23 { animation-delay: 6.1s; }
.m24 { animation-delay: 6.25s; }
.m25 { animation-delay: 6.4s; }

@keyframes draw {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes drawMeridian {
    to {
        stroke-dashoffset: 0;
    }
}
</style>
</head>
