<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalp ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

svg {
    width: 94vw;
    height: 94vw;
    max-width: 650px;
    max-height: 650px;
}

#heart {
    fill: none;
    stroke: red;
    stroke-width: 0.45;
    stroke-linecap: round;
    stroke-linejoin: round;
}

#emoji {
    opacity: 0;
    font-size: 2.2px;
    text-anchor: middle;
}

@keyframes showEmoji {
    to {
        opacity: 1;
    }
}
</style>
</head>

<body>

<svg viewBox="-18 -16 36 32">

    <path id="heart"></path>

    <text id="emoji" x="0" y="13">❤️</text>

</svg>

<script>

const heart = document.getElementById("heart");
const emoji = document.getElementById("emoji");

const points = [];
const toplam = 1200;

/* Matematiksel kalp */
for (let i = 0; i <= toplam; i++) {

    const t = (i / toplam) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    points.push(
        `${x * 0.95},${-y * 0.95}`
    );
}

heart.setAttribute(
    "d",
    "M " + points.join(" L ")
);

/* Çizginin toplam uzunluğu */
const uzunluk = heart.getTotalLength();

heart.style.strokeDasharray = uzunluk;
heart.style.strokeDashoffset = uzunluk;

/* Kalbin çizilmesi */
heart.animate(
    [
        { strokeDashoffset: uzunluk },
        { strokeDashoffset: 0 }
    ],
    {
        duration: 5000,
        easing: "linear",
        fill: "forwards"
    }
);

/* 5 saniye sonra emoji */
setTimeout(() => {
    emoji.style.animation = "showEmoji 2s forwards";
}, 5000);

</script>

</body>
</html>
