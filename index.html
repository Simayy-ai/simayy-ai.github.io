<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalp</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.heart {
    width: 320px;
    height: 290px;
}

svg {
    width: 320px;
    height: 290px;
    overflow: visible;
}

path {
    fill: none;
    stroke: #ff1744;
    stroke-width: 1.35;
    stroke-linecap: round;
}

.outline {
    stroke-width: 2;
    stroke-dasharray: 1100;
    stroke-dashoffset: 1100;
    animation: draw 3s ease forwards;
}

.meridian {
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: draw 1.2s ease forwards;
}

/* Çizgiler çok sık ve sırayla */
.meridian:nth-of-type(2)  { animation-delay: 2.7s; }
