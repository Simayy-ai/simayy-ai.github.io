<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalp ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

svg {
    width: 90vw;
    height: 90vw;
    max-width: 600px;
    max-height: 600px;
}

#heart {
    fill: none;
    stroke: red;
    stroke-width: 0.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

#love {
    fill: white;
    font-family: Arial, sans-serif;
    font-size: 2px;
    text-anchor: middle;
    opacity: 0;
}

@keyframes appear {
    to {
        opacity: 1;
    }
}
</style>
</head>

<body>

<svg viewBox="-18 -18 36 36">

    <path id="heart"></path>

    <text id="love" x="0" y="14">❤️</text>

</svg>

<script>

const heart = document.getElementById("heart");
const love = document.getElementById("love");

let points = [];

const toplam = 800;

for (let i = 0; i <= toplam; i++) {

    const t = (i / toplam) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    points.push(`${x / 20},${-y / 20}`);
}

heart.setAttribute(
    "d",
    "M " + points.join(" L ")
);

const length = heart.getTotalLength();

heart.style.strokeDasharray = length;
heart.style.strokeDashoffset = length;

heart.animate(
    [
        { strokeDashoffset: length },
        { strokeDashoffset: 0 }
    ],
    {
        duration: 5000,
        easing: "linear",
        fill: "forwards"
    }
);

setTimeout(() => {
    love.style.animation = "appear 2s forwards";
}, 5000);

</script>

</body>
</html>
