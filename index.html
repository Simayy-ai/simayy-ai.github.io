<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalp ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    svg {
        width: 90vw;
        height: 90vw;
        max-width: 600px;
        max-height: 600px;
        overflow: visible;
    }

    #heart {
        fill: none;
        stroke: red;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .text {
        position: absolute;
        bottom: 12%;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 20px;
        text-align: center;
        opacity: 0;
        animation: yazı 2s ease forwards;
        animation-delay: 3s;
    }

    @keyframes yazı {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<svg viewBox="-18 -18 36 36">
    <path id="heart"></path>
</svg>

<div class="text">❤️</div>

<script>
const heart = document.getElementById("heart");

let points = [];

// Python kodundaki:
// x = 15*sin(e)^3
// y = 12*cos(e)-5*cos(2e)-2*cos(3e)-cos(4e)

const toplam = 6000;

for (let m = 0; m < toplam; m++) {

    const e = m;

    const x = 15 * Math.pow(Math.sin(e), 3);

    const y =
        12 * Math.cos(e)
        - 5 * Math.cos(2 * e)
        - 2 * Math.cos(3 * e)
        - Math.cos(4 * e);

    // SVG'de Y ekseni ters olduğu için -
    points.push(`${x / 20},${-y / 20}`);
}

// Noktaları birleştir
heart.setAttribute("d", "M " + points.join(" L "));

// Çiziliyormuş gibi animasyon
const uzunluk = heart.getTotalLength();

heart.style.strokeDasharray = uzunluk;
heart.style.strokeDashoffset = uzunluk;

heart.animate(
    [
        { strokeDashoffset: uzunluk },
        { strokeDashoffset: 0 }
    ],
    {
        duration: 5000,
        easing: "linear",
        fill: "forwards"
    }
);
</script>

</body>
  </html>
